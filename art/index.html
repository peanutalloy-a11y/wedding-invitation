<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Invitation artwork</title>
  <style>
    body { margin: 0; padding: 2rem; background: #f1e6d6; color: #5a4e45; font-family: system-ui, sans-serif; }
    h1 { font-family: Georgia, serif; }
    a { color: inherit; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 1.5rem; }
    figure { margin: 0; padding: 1rem; background: #fff9ef; border: 1px solid #dccdb5; border-radius: 8px; }
    figure a { display: block; }
    img { display: block; width: 100%; height: 300px; object-fit: contain; }
    figcaption { margin-top: 1rem; text-align: center; }
  </style>
</head>
<body>
  <p><a href="../index.html">Open wedding invitation</a></p>
  <h1>Invitation artwork</h1>
  <p>Select an image to view it at full size.</p>
  <main class="gallery">
    <figure><a href="hero.png"><img src="hero.png" alt="Hero artwork"></a><figcaption>hero.png</figcaption></figure>
    <figure><a href="bow.png"><img src="bow.png" alt="Green silk bow without seal"></a><figcaption>bow.png</figcaption></figure>
    <figure><a href="seal.png"><img src="seal.png" alt="Floral wax seal without bow"></a><figcaption>seal.png</figcaption></figure>
    <figure><a href="paper.png"><img src="paper.png" alt="Paper texture"></a><figcaption>paper.png</figcaption></figure>
    <figure><a href="liner.png"><img src="liner.png" alt="Envelope liner artwork"></a><figcaption>liner.png</figcaption></figure>
    <figure><a href="cathedral.png"><img src="cathedral.png" alt="Cathedral artwork"></a><figcaption>cathedral.png</figcaption></figure>
    <figure><a href="pier.png"><img src="pier.png" alt="Pier artwork"></a><figcaption>pier.png</figcaption></figure>
    <figure><a href="balustrade.png"><img src="balustrade.png" alt="Balustrade artwork"></a><figcaption>balustrade.png</figcaption></figure>
    <figure><a href="harbour-sunset.png"><img src="harbour-sunset.png" alt="Harbour sunset artwork"></a><figcaption>harbour-sunset.png</figcaption></figure>
    <figure><a href="floral-front.png"><img src="floral-front.png" alt="Front floral artwork"></a><figcaption>floral-front.png</figcaption></figure>
    <figure><a href="floral-corner.png"><img src="floral-corner.png" alt="Corner floral artwork"></a><figcaption>floral-corner.png</figcaption></figure>
    <figure><a href="rsvp-sprig.png"><img src="rsvp-sprig.png" alt="RSVP sprig artwork"></a><figcaption>rsvp-sprig.png</figcaption></figure>
  </main>
</body>
</html>
